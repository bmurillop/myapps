<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: -0.025em;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
            padding: 1rem;
        }
        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid #334155;
            text-align: center;
        }
        .card:hover {
            transform: translateY(-4px);
            background-color: #334155;
            border-color: var(--accent);
        }
        .card h2 {
            margin: 0 0 0.5rem 0;
            color: var(--accent);
        }
        .card p {
            margin: 0;
            opacity: 0.8;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <h1>MY Applications</h1>
    <div class="grid">
        <a href="http://practicas.internal:3000" class="card">
            <h2>MY Practicas</h2>
            <p>Practice management system</p>
        </a>
        <a href="http://finanzas.internal:3001" class="card">
            <h2>MY Finanzas</h2>
            <p>Automated finance tracker (Katynator)</p>
        </a>
        <a href="http://ai.internal:8080" class="card">
            <h2>MY Chat</h2>
            <p>Local AI Chat Interface</p>
        </a>
    </div>
</body>
</html>
